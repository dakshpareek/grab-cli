[package]
name = "grab-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", default-features = false, features = [
    "rustls-tls",
    "stream",
] }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
indicatif = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
futures-util = "0.3"
ratatui = "0.26"
crossterm = "0.27"
